name: 설치파일 만들기

# Every push to main (and "Run workflow" by hand) builds the Windows installer
# and publishes it as a release, so the newest setup.exe is always one click away.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: eoheung-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: eoheung-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Check (types and the study board's tests)
        shell: pwsh
        env:
          TZ: Asia/Seoul
        run: |
          npx tsc --noEmit
          node --import ./tests/setup.mjs --test tests/study.test.mjs tests/weather.test.mjs

      - name: Build the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Eoheung-Windows-setup
          path: windows/release/Eoheung-Windows-setup.exe
          retention-days: 14

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $n = "${{ github.run_number }}"
          $tag = "v$v-build$n"
          $notes = @"
          어흥이 $v (빌드 $n)

          Eoheung-Windows-setup.exe 를 받아 실행하세요. 서명하지 않은 개인 빌드라
          Windows 가 경고를 띄우면 **추가 정보 → 실행** 을 누르면 돼요.
          "@
          gh release create $tag "release/Eoheung-Windows-setup.exe" --title "어흥이 $v (빌드 $n)" --notes $notes --latest
